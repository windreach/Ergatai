[workspace]
resolver = "2"
members = [
    "crates/ergatai-error",
    "crates/ergatai-binary",
    "crates/ergatai-nats",
    "crates/ergatai-dag",
    "crates/ergatai-lock",
    "crates/ergatai-agent",
    "crates/ergatai-runtime",
    "crates/ergatai-collab",
    "crates/ergatai-core",
    "crates/ergatai-api",
    "crates/ergatai-cli",
    "examples/simple-agent",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Ergatai Team"]
license = "Apache-2.0"
repository = "https://github.com/windreach/Ergatai"
homepage = "https://github.com/windreach/Ergatai"
documentation = "https://docs.rs/ergatai-core"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.36", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4.5", features = ["derive", "env"] }
ratatui = "0.30"
crossterm = "0.29"

# TUI ecosystem
ratatui-interact = "0.5.3"
tui-widgets = { version = "0.7.10", default-features = false, features = [
    "popup",
    "scrollview",
    "scrollbar",
    "prompts",
    "big-text",
] }
tui-skeleton = "0.3.0"
unicode-width = "0.2"

# Database
rusqlite = { version = "0.31", features = ["bundled"] }

# NATS
async-nats = "0.50"

# Syntax highlighting & diff
syntect = "5.2"
imara-diff = "0.1"

# Utilities
uuid = { version = "1.7", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# HTTP client (rustls backend for TLS support)
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }

# Low-level / syscalls (fanotify, etc.)
libc = "0.2"

# Async utilities (CancellationToken, codecs)
tokio-util = { version = "0.7", features = ["rt"] }

# Fast synchronization primitives
parking_lot = "0.12"
