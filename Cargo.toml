[workspace]
resolver = "2"
members = [
    "crates/ergatai-error",
    "crates/ergatai-nats",
    "crates/ergatai-dag",
    "crates/ergatai-lock",
    "crates/ergatai-agent",
    "crates/ergatai-acp",
    "crates/ergatai-collab",
    "crates/ergatai-core",
    "crates/ergatai-cli",
    "crates/ergatai-api",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Ergatai Team"]
license = "MIT"
repository = "https://github.com/ergatai/ergatai"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.36", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4.5", features = ["derive", "env"] }
ratatui = "0.30"
crossterm = "0.29"

# Database
rusqlite = { version = "0.31", features = ["bundled"] }

# NATS
async-nats = "0.38"

# Syntax highlighting & diff
syntect = "5.2"
imara-diff = "0.1"

# Utilities
uuid = { version = "1.7", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
