<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ergatai Logo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0D0D14;
    color: #fff;
    font-family: 'Segoe UI', system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    gap: 60px;
  }
  .logo-row {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
  }
  .label {
    font-size: 13px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #666677;
  }
  .sizes {
    display: flex;
    align-items: flex-end;
    gap: 48px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .size-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .size-item span {
    font-size: 11px;
    color: #444;
    letter-spacing: 2px;
  }
</style>
</head>
<body>

<div class="logo-row">
  <span class="label">Full Logo</span>
  <img src="logo.svg" alt="Ergatai" style="max-width:512px; height:auto;">
</div>

<div class="sizes">
  <div class="size-item">
    <img src="logo-icon.svg" alt="Icon" width="256" height="256">
    <span>256px icon</span>
  </div>
  <div class="size-item">
    <img src="logo-icon.svg" alt="Icon" width="128" height="128">
    <span>128px</span>
  </div>
  <div class="size-item">
    <img src="logo-icon.svg" alt="Icon" width="64" height="64">
    <span>64px</span>
  </div>
  <div class="size-item">
    <img src="logo-icon.svg" alt="Icon" width="32" height="32">
    <span>32px favicon</span>
  </div>
</div>

</body>
</html>
