[package]
name = "ergatai-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "ergatai"
path = "src/main.rs"

[dependencies]
# Core library
ergatai-core = { path = "../ergatai-core" }

# Async
tokio.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Error handling
anyhow.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true

# CLI
clap.workspace = true
ratatui.workspace = true
crossterm.workspace = true

# Terminal utilities
dialoguer = "0.11"   # retained for first-run setup wizard (not in main TUI loop)
console = "0.15"
tui-textarea-2 = "0.12"
tui-markdown = "0.3"
unicode-width.workspace = true

# TUI ecosystem
ratatui-interact.workspace = true
tui-widgets.workspace = true
tui-skeleton.workspace = true

# Phase 3: syntax highlighting + diff
syntect.workspace = true
imara-diff.workspace = true

# Utilities
uuid.workspace = true
chrono.workspace = true

[dev-dependencies]
tokio-test = "0.4"
