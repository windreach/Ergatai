[package]
name = "ergatai-api"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "ergatai-api"
path = "src/main.rs"

[dependencies]
# Core library
ergatai-core = { path = "../ergatai-core" }
# ACP protocol (HTTP client)
ergatai-acp = { path = "../ergatai-acp" }
# NATS messaging
ergatai-nats = { path = "../ergatai-nats" }

# NATS client (for message forwarding)
async-nats.workspace = true
futures = "0.3"

# Async
tokio.workspace = true
async-trait.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Error handling
anyhow.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true

# CLI
clap.workspace = true

# MCP protocol (rmcp SDK)
rmcp = { version = "3", features = ["server", "transport-streamable-http-server", "macros"] }
schemars = "1.0"
tokio-util = "0.7"

# HTTP server
axum = { version = "0.7", features = ["ws"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Rate limiting
tower_governor = "0.4"

# Metrics (Prometheus)
metrics = "0.24"
metrics-exporter-prometheus = "0.16"

# Utilities
uuid.workspace = true
chrono.workspace = true

# HTTP client (for ACP forwarding) - uses rustls from workspace
reqwest.workspace = true

[dev-dependencies]
tokio-test = "0.4"
