[package]
name = "ergatai-api"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "ergatai-server"
path = "src/main.rs"

[dependencies]
# Core library
ergatai-core = { path = "../ergatai-core" }
# NATS messaging
ergatai-nats = { path = "../ergatai-nats" }
# Error types
ergatai-error = { path = "../ergatai-error" }
# Agent runtime (pluggable backends)
ergatai-runtime = { path = "../ergatai-runtime" }
# Binary locator (NATS, rmux daemon)
ergatai-binary = { path = "../ergatai-binary" }
# File access control (locks, tokens)
ergatai-lock = { path = "../ergatai-lock" }

# NATS client (for message forwarding)
async-nats.workspace = true
futures = "0.3"

# Async
tokio.workspace = true
async-trait.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Error handling
anyhow.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true

# CLI
clap.workspace = true

# MCP protocol (rmcp SDK)
rmcp = { version = "3", features = ["server", "transport-streamable-http-server", "macros", "elicitation"] }
schemars = "1.0"
tokio-util = "0.7"

# HTTP server
axum = { version = "0.7", features = ["ws"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Rate limiting
tower_governor = "0.4"

# Metrics (Prometheus)
metrics = "0.24"
metrics-exporter-prometheus = "0.16"

# Utilities
uuid.workspace = true
chrono.workspace = true

[dev-dependencies]
tokio-test = "0.4"
