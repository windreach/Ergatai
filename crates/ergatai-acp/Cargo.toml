[package]
name = "ergatai-acp"
version = "0.1.0"
edition = "2021"
authors = ["Ergatai Team"]
license = "MIT"
repository = "https://github.com/ergatai/ergatai"
description = "ACP (Agent Client Protocol) implementation for Ergatai"

[dependencies]
ergatai-error = { path = "../ergatai-error" }
ergatai-nats = { path = "../ergatai-nats" }
ergatai-lock = { path = "../ergatai-lock" }
# TODO(middleware): Re-enable after HTTP client migration
# ergatai-agent = { path = "../ergatai-agent" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
async-nats.workspace = true
agent-client-protocol = { version = "2", features = ["unstable_protocol_v2"] }
agent-client-protocol-tokio = "0.11"
agent-client-protocol-http = { version = "2", features = ["client"] }
async-trait.workspace = true
futures = "0.3"
futures-util = "0.3"
reqwest = { version = "0.11", features = ["json", "stream"] }
rusqlite.workspace = true
anyhow.workspace = true
dirs = "5.0"
