[package]
name = "ergatai-binary"
version = "0.1.0"
edition = "2021"
authors = ["Ergatai Team"]
license = "Apache-2.0"
repository = "https://github.com/windreach/Ergatai"
description = "Binary locator and manager for Ergatai external dependencies (NATS, rmux)"
build = "build.rs"

[dependencies]
ergatai-error = { path = "../ergatai-error" }
tracing = "0.1"
thiserror = "1.0"

[build-dependencies]
ureq = "2.9"
flate2 = "1.0"
tar = "0.4"
zip = "0.6"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.10"
