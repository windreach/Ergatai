[package]
name = "ergatai-runtime"
version = "0.1.0"
edition = "2021"
authors = ["Ergatai Team"]
license = "Apache-2.0"
repository = "https://github.com/windreach/Ergatai"
description = "Pluggable agent runtime backends for Ergatai"

[features]
default = []
## Enable the deprecated rmux backend (pulls in rmux-sdk).
## The default backend is tmux (ergatai-binary is always included for binary detection).
rmux = ["dep:rmux-sdk"]

[dependencies]
ergatai-error = { path = "../ergatai-error" }
ergatai-binary = { path = "../ergatai-binary" }
tokio.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
rmux-sdk = { version = "0.10.0", default-features = false, optional = true }

[dev-dependencies]
tempfile = "3.10"
