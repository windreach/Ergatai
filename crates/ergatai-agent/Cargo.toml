[package]
name = "ergatai-agent"
version = "0.1.0"
edition = "2021"
authors = ["Ergatai Team"]
license = "MIT"
repository = "https://github.com/ergatai/ergatai"
description = "Agent configuration and discovery for Ergatai"

[dependencies]
ergatai-error = { path = "../ergatai-error" }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tokio.workspace = true
anyhow.workspace = true
dirs = "5.0"
toml = "1.0"
glob = "0.3"
walkdir = "2.4"
agent-client-protocol = "2"
base64 = "0.22"
url = { version = "2.0", features = ["serde"] }
