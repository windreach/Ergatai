[package]
name = "ergatai-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
# Ergatai crates
ergatai-error = { path = "../ergatai-error" }
ergatai-nats = { path = "../ergatai-nats" }
ergatai-dag = { path = "../ergatai-dag" }
ergatai-lock = { path = "../ergatai-lock" }

# Async
tokio.workspace = true
async-trait.workspace = true
futures = "0.3"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["codec"] }

# Serialization
serde.workspace = true
serde_json.workspace = true

# Error handling
anyhow.workspace = true
thiserror.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Database
rusqlite.workspace = true

# NATS
async-nats.workspace = true

# ACP Protocol SDK
agent-client-protocol = "2"
agent-client-protocol-tokio = "0.11"

# Utilities
uuid.workspace = true
chrono.workspace = true

# HTTP client (for ACP SDK)
reqwest = { version = "0.11", features = ["json", "stream"] }

# File system
dirs = "5.0"
glob = "0.3"
notify = "6.1"
walkdir = "2.4"

# Git operations for snapshots
git2 = { version = "0.18" }

# Process management
nix = { version = "0.29", default-features = false, features = ["signal"] }

# Regex
regex = "1.10"

# Base64
base64 = "0.22"
hex = "0.4"
md5 = "0.7"

# SHA256
sha2 = "0.10"

# Random for retry jitter
rand = "0.8"

# Encoding
url = { version = "2.0", features = ["serde"] }
toml = "1.0"

# Filter expressions
evalexpr = "11.0"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.10"
