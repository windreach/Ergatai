[package]
name = "ergatai"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# ACP Protocol SDK
agent-client-protocol = "2"
agent-client-protocol-tokio = "0.11"

# NAPI-RS for Node.js bindings
napi = { version = "2.16", features = ["async"] }
napi-derive = "2.16"

# Async
tokio = { version = "1.37", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
futures-util = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# File system
dirs = "5.0"
glob = "0.3"
notify = "6.1"  # fsevents/inotify cross-platform file watching

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Async traits
async-trait = "0.1"

# Random for retry jitter
rand = "0.8"

# NATS client for persistent messaging
async-nats = "0.38"

# SQLite for lock management (bundled to avoid system dependency)
rusqlite = { version = "0.31", features = ["bundled"] }

# Git operations for snapshots (bundled to avoid system dependency)
git2 = { version = "0.18", features = [] }

# Regex for @mention detection
regex = "1.10"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Date/time
chrono = "0.4"

# IDs and URLs
uuid = { version = "1.0", features = ["v4", "serde"] }
url = { version = "2.0", features = ["serde"] }

# CLI and config
clap = { version = "4", features = ["derive", "env"] }
toml = "1.0"

# Encoding
base64 = "0.22"
hex = "0.4"
md5 = "0.7"

# Filter expressions
evalexpr = "11.0"

# Process management (Unix)
[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", default-features = false, features = ["signal"] }

[build-dependencies]
napi-build = "2.1"

[dev-dependencies]
tempfile = "3"
